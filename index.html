<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark It Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PAGE 1 : LOADING SCREEN -->
  <section id="loading-screen" class="screen active">
    <div class="floating-hearts">
      <span>❤</span><span>❤</span><span>❤</span><span>❤</span><span>❤</span>
    </div>

    <div class="heart-loader">
      <div class="ring"></div>
      <div class="heart">❤</div>
      <span class="spark s1">✦</span>
      <span class="spark s2">✦</span>
    </div>

    <h1 class="loading-title">Preparing something special for<br>you<span class="dots">...</span></h1>
    <p class="loading-sub">Made with love <span class="mini-heart">❤</span></p>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-text" id="progressText">0%</span>
    </div>
  </section>

  <!-- PAGE 2 : CALENDAR SCREEN -->
  <section id="calendar-screen" class="screen">
    <div class="card">
      <div class="avatar">🐼</div>
      <h1 class="card-title">Mark It Forever In My Heart</h1>

      <div class="calendar">
        <div class="cal-header">
          <span class="cal-month">October</span> <span class="cal-year">2005</span>
        </div>

        <div class="cal-grid cal-days">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>

        <div class="cal-grid cal-dates" id="calDates">
          <!-- filled by JS -->
        </div>
      </div>

      <p class="marked-date">07 . 08 . 2005</p>
      <p class="marked-caption">Save this date forever.</p>

<button class="cta-btn" id="ctaBtn" onclick="window.location.href='index1.html'">
  Save the Date in My ❤
</button>        
    </div>
  </section>

  <script src="js/scipt.js"></script>
  
</body>
</html>
